name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build web app
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action installs "tools platform-tools" by default, and Google has
          # removed the legacy "tools" package from the SDK repository, so
          # sdkmanager now exits 1 on it and takes the whole job with it. Gradle
          # installs whatever build-tools and platform the project needs itself.
          packages: platform-tools

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: formready-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  # The bundle Play actually accepts. Separate from the debug job above, which
  # stays exactly as it is because that is the APK used for testing on a phone.
  #
  # Gated on the signing secrets existing, so ordinary pushes and forks skip it
  # rather than failing: the key belongs to the app owner, and until they have
  # added it there is nothing here to sign with.
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      # Secrets cannot be read in a job-level `if`, so the whole job starts and
      # every step below asks this one whether there is anything to sign with.
      - name: Check whether a signing key is configured
        id: signing
        run: echo "ready=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        if: steps.signing.outputs.ready == 'true'
        run: npm ci

      - name: Build web app
        if: steps.signing.outputs.ready == 'true'
        run: npm run build

      - name: Set up JDK 21
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: steps.signing.outputs.ready == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Sync Capacitor Android project
        if: steps.signing.outputs.ready == 'true'
        run: npx cap sync android

      - name: Restore the signing key
        if: steps.signing.outputs.ready == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundle
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          FORMREADY_STORE_FILE: ${{ runner.temp }}/upload.jks
          FORMREADY_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FORMREADY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FORMREADY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Remove the key from the runner
        if: always() && steps.signing.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload the bundle
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: formready-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
